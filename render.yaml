services:
  - type: web
    name: voice-profile
    runtime: docker
    dockerfilePath: ./voicecheck/backend/Dockerfile
    dockerContext: ./voicecheck/backend
    plan: free
    region: oregon
    envVars:
      - key: TRANSCRIPTION_BACKEND
        value: openai_api
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: AUTH_REQUIRED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        value: price_1TTMqSGESmAb2SAXMLFFBP1s
      - key: STRIPE_PRICE_PRO
        value: price_1TTMqiGESmAb2SAX4MFYcL91
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: PORT
        value: "8000"
