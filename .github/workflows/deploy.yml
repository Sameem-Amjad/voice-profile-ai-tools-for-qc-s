name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'voicecheck/backend/**'
      - 'deploy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/voice-profile
            git pull origin main
            bash deploy/deploy.sh
