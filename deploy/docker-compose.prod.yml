# Production Docker Compose for EC2.
# Usage:
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# All secrets come from /etc/voicecheck/.env on the EC2 host.
# Never commit .env to git.

services:
  api:
    image: voicecheck-api:latest        # built by deploy.sh
    container_name: voicecheck_api
    restart: unless-stopped
    env_file:
      - /etc/voicecheck/.env            # secrets live here on the EC2 host
    ports:
      - "127.0.0.1:8000:8000"           # only expose to localhost; nginx proxies in
    volumes:
      - uploads:/app/uploads            # fallback for local storage mode
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 900M                  # leave ~100 MB for OS on t2.micro (1 GB RAM)

volumes:
  uploads:
  logs:
