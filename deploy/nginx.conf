# /etc/nginx/sites-available/voicecheck
# Symlink to /etc/nginx/sites-enabled/voicecheck after setup.
#
# Handles:
#   - HTTPS termination via Let's Encrypt (certbot fills in the ssl lines)
#   - Reverse proxy to FastAPI on port 8000
#   - Large request body limit removed — S3 presigned uploads bypass nginx entirely
#   - Generous timeouts for long transcription polling requests

upstream voicecheck_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP;

    # ── SSL — managed by certbot, do not edit these lines manually ────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_OR_IP/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Request limits ────────────────────────────────────────────────────────
    # File uploads go directly to S3 via presigned URLs — nginx never sees the
    # audio bytes.  The only large payload we accept is the script text in
    # /api/compare (max 50 000 chars ≈ 200 KB).
    client_max_body_size 10M;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    # Transcription of a 30-min file via OpenAI can take ~60 s.
    # The client polls, so individual requests are fast — but keep this generous.
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;

    # ── Proxy to FastAPI ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://voicecheck_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── FastAPI docs (disable in prod if you prefer) ──────────────────────────
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass         http://voicecheck_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Health check (no auth) ────────────────────────────────────────────────
    location /api/health {
        proxy_pass         http://voicecheck_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Block common scanner paths ────────────────────────────────────────────
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}
